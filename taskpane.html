<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word GPT</title>
    <link rel="stylesheet" href="/src/taskpane/style.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="app">
      <header><span class="mark">✦</span><div><strong>Word GPT</strong><small>Asistente del documento</small></div><button id="settings" title="Configuración">⚙</button></header>
      <section id="config" class="config hidden">
        <p>Este asistente utiliza un modelo local en el Mac mini. El documento no se envía a OpenAI ni a Anthropic.</p>
      </section>
      <section class="context">
        <span id="context-label">Listo para leer el documento</span>
        <button id="refresh-context">Actualizar contexto</button>
      </section>
      <section id="messages" class="messages" aria-live="polite">
        <article class="assistant">Hola. Puedo resumir, reescribir o analizar el documento. Selecciona texto para trabajar sobre una parte concreta.</article>
      </section>
      <div id="actions" class="actions hidden"><button id="insert">Insertar en cursor</button><button id="replace">Reemplazar selección</button></div>
      <form id="chat-form"><textarea id="prompt" rows="3" placeholder="Pregunta algo sobre el documento…"></textarea><button id="send" type="submit">Enviar</button></form>
    </main>
    <script type="module" src="/src/taskpane/taskpane.js"></script>
  </body>
</html>
