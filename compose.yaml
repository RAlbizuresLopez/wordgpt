services:
  wordgpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordgpt-gateway
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # Ollama continúa nativo en macOS para aprovechar Metal en el M4.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PORT: 3000
      # Docker necesita una interfaz de contenedor; el puerto del Mac sigue limitado a 127.0.0.1.
      BIND_HOST: 0.0.0.0
    ports:
      # Solo Tailscale Serve, que se ejecuta en el host, puede alcanzar este puerto.
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
